# Streamline fork release workflow.
# Builds and pushes a Docker image to gmdhstreamline/chisel-fork on tag pushes
# matching v*-sl* (e.g. v1.11.6-sl1). Secrets DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN are scoped to the `dockerhub-publish` environment.

name: Streamline Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-sl*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dockerhub-publish
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Calculate vars
        id: vars
        env:
          REF_NAME: ${{ github.ref_name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          APP_IMAGE="${DOCKERHUB_USERNAME}/chisel-fork:${REF_NAME}"
          echo "app_image=$APP_IMAGE" >> "$GITHUB_OUTPUT"
          echo "${REF_NAME} → ${APP_IMAGE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.app_image }}
