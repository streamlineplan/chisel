# Streamline fork release workflow.
# Builds and pushes a Docker image to gmdhstreamline/chisel-fork on tag pushes
# matching v*-sl* (e.g. v1.11.6-sl1). Aligned with argocd-deployment-service
# CI patterns: gmdhstreamline registry, DOCKERHUB_ACCESS_TOKEN secret,
# git tag as image tag.

name: Streamline Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-sl*"

env:
  IMAGE_NAME: gmdhstreamline/chisel-fork

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Calculate vars
        id: vars
        env:
          REF_NAME: ${{ github.ref_name }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          APP_IMAGE="${IMAGE_NAME}:${REF_NAME}"
          echo "app_image=$APP_IMAGE" >> "$GITHUB_OUTPUT"
          echo "${REF_NAME} → ${APP_IMAGE}"

      - name: Check secrets present
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then echo "DOCKERHUB_TOKEN: SET (len=${#DOCKERHUB_TOKEN})"; else echo "DOCKERHUB_TOKEN: EMPTY"; fi
          if [ -n "$DOCKERHUB_ACCESS_TOKEN" ]; then echo "DOCKERHUB_ACCESS_TOKEN: SET (len=${#DOCKERHUB_ACCESS_TOKEN})"; else echo "DOCKERHUB_ACCESS_TOKEN: EMPTY"; fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: gmdhstreamline
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.app_image }}
